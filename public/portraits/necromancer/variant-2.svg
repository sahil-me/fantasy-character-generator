<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="necro2-bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#0f766e" stop-opacity="0.5"/>
      <stop offset="75%" stop-color="#042f2e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#011716"/>
    </radialGradient>
    <linearGradient id="necro2-hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ccfbf1"/>
      <stop offset="80%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="necro2-mantle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="necro2-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="70%" stop-color="#ccfbf1"/>
      <stop offset="100%" stop-color="#99f6e4"/>
    </linearGradient>
    <radialGradient id="necro2-eye" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="35%" stop-color="#34d399"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>
    <filter id="wraith-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#necro2-bg)"/>

  <!-- Wraith Crypt Sigil -->
  <g opacity="0.4" stroke="#5eead4" stroke-width="1.8" fill="none">
    <circle cx="250" cy="210" r="175"/>
    <circle cx="250" cy="210" r="145" stroke-dasharray="10,6"/>
    <polygon points="250,55 385,285 115,285"/>
  </g>

  <!-- Floating Spirit Orbs -->
  <g fill="#99f6e4" opacity="0.8" filter="url(#wraith-glow)">
    <circle cx="150" cy="130" r="4"/>
    <circle cx="350" cy="120" r="4.5"/>
    <circle cx="110" cy="260" r="3"/>
    <circle cx="390" cy="240" r="3.5"/>
  </g>

  <!-- Raven Feather Mantle & Shoulders -->
  <path d="M 100 340 C 90 410 70 480 50 500 L 450 500 C 430 480 410 410 400 340 C 340 370 160 370 100 340 Z" fill="url(#necro2-mantle)" stroke="#064e3b" stroke-width="3"/>
  
  <circle cx="250" cy="345" r="13" fill="#065f46" stroke="#6ee7b7" stroke-width="2.5"/>
  <circle cx="250" cy="345" r="6" fill="#a7f3d0" filter="url(#wraith-glow)"/>

  <!-- Neck -->
  <path d="M 230 235 L 230 275 C 242 283 258 283 270 275 L 270 235 Z" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>

  <!-- Anime Face -->
  <path d="M 198 175 C 198 238 224 268 250 268 C 276 268 302 238 302 175 C 302 125 198 125 198 175 Z" fill="url(#necro2-skin)" stroke="#0f766e" stroke-width="1.8"/>
  <ellipse cx="220" cy="214" rx="8" ry="3.5" fill="#34d399" opacity="0.35"/>
  <ellipse cx="280" cy="214" rx="8" ry="3.5" fill="#34d399" opacity="0.35"/>

  <!-- Eyes (Emerald Soul Fire) -->
  <g id="necro2-left-eye">
    <path d="M 212 195 C 220 188 232 188 240 193" stroke="#022c22" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 215 191 L 221 186" stroke="#022c22" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="226" cy="201" rx="9" ry="11" fill="url(#necro2-eye)"/>
    <ellipse cx="226" cy="201" rx="4" ry="6" fill="#021f18"/>
    <circle cx="223" cy="197" r="3" fill="#ffffff"/>
    <circle cx="229" cy="205" r="1.5" fill="#ffffff"/>
    <path d="M 218 212 C 225 215 233 214 237 211" stroke="#059669" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M 210 181 C 219 176 232 177 240 181" stroke="#047857" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
  <g id="necro2-right-eye">
    <path d="M 288 195 C 280 188 268 188 260 193" stroke="#022c22" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 285 191 L 279 186" stroke="#022c22" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="274" cy="201" rx="9" ry="11" fill="url(#necro2-eye)"/>
    <ellipse cx="274" cy="201" rx="4" ry="6" fill="#021f18"/>
    <circle cx="271" cy="197" r="3" fill="#ffffff"/>
    <circle cx="277" cy="205" r="1.5" fill="#ffffff"/>
    <path d="M 282 212 C 275 215 267 214 263 211" stroke="#059669" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M 290 181 C 281 176 268 177 260 181" stroke="#047857" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Nose & Wraith Smirk -->
  <path d="M 250 214 L 248 223 L 253 223" stroke="#0f766e" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M 242 241 C 248 244 254 244 259 241" stroke="#059669" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- Silver-Aqua Anime Hair -->
  <g id="necro2-hair-group">
    <path d="M 160 170 C 130 220 120 340 140 400 C 160 330 180 250 190 180 Z" fill="url(#necro2-hair)"/>
    <path d="M 340 170 C 370 220 380 340 360 400 C 340 330 320 250 310 180 Z" fill="url(#necro2-hair)"/>
    <path d="M 180 150 C 170 95 220 70 250 70 C 280 70 330 95 320 150 C 310 115 280 100 250 100 C 220 100 190 115 180 150 Z" fill="url(#necro2-hair)"/>

    <path d="M 195 130 C 185 165 195 210 215 225 C 218 190 220 155 210 135 Z" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/>
    <path d="M 215 125 C 225 155 235 185 240 195 C 242 170 240 145 235 125 Z" fill="url(#necro2-hair)" stroke="#0f766e" stroke-width="1.2"/>
    <path d="M 245 120 C 250 145 252 170 250 185 C 255 165 260 145 258 120 Z" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/>
    <path d="M 285 125 C 275 155 265 185 260 195 C 258 170 260 145 265 125 Z" fill="url(#necro2-hair)" stroke="#0f766e" stroke-width="1.2"/>
    <path d="M 305 130 C 315 165 305 210 285 225 C 282 190 280 155 290 135 Z" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/>
  </g>

  <!-- Skeletal Spellbook Aura -->
  <g id="necro2-tome" filter="url(#wraith-glow)">
    <rect x="330" y="320" width="50" height="40" rx="3" transform="rotate(-10 355 340)" fill="#022c22" stroke="#34d399" stroke-width="2"/>
    <circle cx="355" cy="340" r="6" fill="#a7f3d0"/>
  </g>
</svg>

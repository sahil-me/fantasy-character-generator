<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="rogue1-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.75"/>
      <stop offset="35%" stop-color="#047857" stop-opacity="0.45"/>
      <stop offset="75%" stop-color="#062e20" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#02140d"/>
    </radialGradient>
    <linearGradient id="rogue1-hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="25%" stop-color="#1f2937"/>
      <stop offset="75%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="rogue1-leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="rogue1-blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="rogue1-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="70%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <radialGradient id="rogue1-eye" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="35%" stop-color="#34d399"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>
    <filter id="shadow-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#rogue1-bg)"/>

  <!-- Moonlight Shadow Grids & Runes -->
  <g opacity="0.35" stroke="#34d399" stroke-width="1.5" fill="none">
    <circle cx="250" cy="210" r="175"/>
    <circle cx="250" cy="210" r="145" stroke-dasharray="8,6"/>
    <circle cx="250" cy="210" r="115"/>
    <line x1="75" y1="210" x2="425" y2="210" stroke-dasharray="4,4"/>
  </g>

  <!-- Phantom Poison Smoke Motes -->
  <g fill="#a7f3d0" opacity="0.75" filter="url(#shadow-glow)">
    <circle cx="140" cy="120" r="3"/>
    <circle cx="360" cy="130" r="4"/>
    <circle cx="110" cy="250" r="2.5"/>
    <circle cx="390" cy="270" r="3.5"/>
    <circle cx="230" cy="70" r="2.5"/>
  </g>

  <!-- Leather Assassin Cowl & Mantle -->
  <path d="M 100 340 C 90 410 70 480 50 500 L 450 500 C 430 480 410 410 400 340 C 340 370 160 370 100 340 Z" fill="url(#rogue1-leather)" stroke="#064e3b" stroke-width="3"/>

  <!-- Crossed Chest Buckles & Straps -->
  <path d="M 150 320 L 350 490 L 320 500 L 120 330 Z" fill="#047857" stroke="#064e3b" stroke-width="1.5"/>
  <path d="M 350 320 L 150 490 L 180 500 L 380 330 Z" fill="#047857" stroke="#064e3b" stroke-width="1.5"/>
  <circle cx="250" cy="405" r="8" fill="#d1fae5" stroke="#065f46" stroke-width="2"/>

  <!-- High Leather Collar -->
  <path d="M 195 245 C 220 260 280 260 305 245 L 320 285 C 275 300 225 300 180 285 Z" fill="#0f172a" stroke="#059669" stroke-width="2"/>

  <!-- Neck -->
  <path d="M 230 230 L 230 260 C 242 268 258 268 270 260 L 270 230 Z" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>

  <!-- Anime Face Base -->
  <path d="M 198 175 C 198 238 224 268 250 268 C 276 268 302 238 302 175 C 302 125 198 125 198 175 Z" fill="url(#rogue1-skin)" stroke="#d97706" stroke-width="1.8"/>
  <ellipse cx="220" cy="214" rx="8" ry="3.5" fill="#34d399" opacity="0.3"/>
  <ellipse cx="280" cy="214" rx="8" ry="3.5" fill="#34d399" opacity="0.3"/>

  <!-- Eyes (Piercing Jade & Turquoise) -->
  <g id="rogue1-left-eye">
    <path d="M 212 195 C 220 188 232 188 240 193" stroke="#022c22" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 215 191 L 221 186" stroke="#022c22" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="226" cy="201" rx="9" ry="11" fill="url(#rogue1-eye)"/>
    <ellipse cx="226" cy="201" rx="4" ry="6" fill="#021f18"/>
    <circle cx="223" cy="197" r="3" fill="#ffffff"/>
    <circle cx="229" cy="205" r="1.5" fill="#ffffff"/>
    <path d="M 218 212 C 225 215 233 214 237 211" stroke="#059669" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M 210 181 C 219 176 232 177 240 181" stroke="#047857" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
  <g id="rogue1-right-eye">
    <path d="M 288 195 C 280 188 268 188 260 193" stroke="#022c22" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 285 191 L 279 186" stroke="#022c22" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="274" cy="201" rx="9" ry="11" fill="url(#rogue1-eye)"/>
    <ellipse cx="274" cy="201" rx="4" ry="6" fill="#021f18"/>
    <circle cx="271" cy="197" r="3" fill="#ffffff"/>
    <circle cx="277" cy="205" r="1.5" fill="#ffffff"/>
    <path d="M 282 212 C 275 215 267 214 263 211" stroke="#059669" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M 290 181 C 281 176 268 177 260 181" stroke="#047857" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Nose & Cunning Grin -->
  <path d="M 250 214 L 248 223 L 253 223" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M 242 240 C 248 244 254 244 259 240" stroke="#047857" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- Sleek Raven Anime Hair -->
  <g id="rogue1-hair-group">
    <path d="M 160 170 C 130 220 125 320 145 370 C 160 300 175 240 185 180 Z" fill="url(#rogue1-hair)"/>
    <path d="M 340 170 C 370 220 375 320 355 370 C 340 300 325 240 315 180 Z" fill="url(#rogue1-hair)"/>
    <path d="M 180 150 C 170 95 220 70 250 70 C 280 70 330 95 320 150 C 310 115 280 100 250 100 C 220 100 190 115 180 150 Z" fill="url(#rogue1-hair)"/>

    <!-- Sharp Anime Bangs -->
    <path d="M 195 130 C 185 165 195 210 215 225 C 218 190 220 155 210 135 Z" fill="#34d399" opacity="0.7"/>
    <path d="M 215 125 C 225 155 235 185 240 195 C 242 170 240 145 235 125 Z" fill="url(#rogue1-hair)" stroke="#064e3b" stroke-width="1.2"/>
    <path d="M 245 120 C 250 145 252 170 250 185 C 255 165 260 145 258 120 Z" fill="#6ee7b7" opacity="0.6"/>
    <path d="M 285 125 C 275 155 265 185 260 195 C 258 170 260 145 265 125 Z" fill="url(#rogue1-hair)" stroke="#064e3b" stroke-width="1.2"/>
    <path d="M 305 130 C 315 165 305 210 285 225 C 282 190 280 155 290 135 Z" fill="#34d399" opacity="0.7"/>
  </g>

  <!-- Phantom Poison Dagger (Foreground Weapon) -->
  <g id="rogue1-dagger" filter="url(#shadow-glow)">
    <line x1="330" y1="470" x2="410" y2="310" stroke="url(#rogue1-blade)" stroke-width="7" stroke-linecap="round"/>
    <line x1="330" y1="470" x2="410" y2="310" stroke="#a7f3d0" stroke-width="12" opacity="0.4" stroke-linecap="round"/>
    <circle cx="395" cy="335" r="6" fill="#34d399"/>
  </g>
</svg>

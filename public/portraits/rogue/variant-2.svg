<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="rogue2-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#059669" stop-opacity="0.45"/>
      <stop offset="75%" stop-color="#022c22" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#01140f"/>
    </radialGradient>
    <linearGradient id="rogue2-hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="80%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="rogue2-leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="rogue2-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="70%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <radialGradient id="rogue2-eye" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="40%" stop-color="#06b6d4"/>
      <stop offset="80%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#164e63"/>
    </radialGradient>
    <filter id="rogue-smoke" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#rogue2-bg)"/>

  <!-- Lunar Geometry Rings -->
  <g opacity="0.4" stroke="#6ee7b7" stroke-width="1.6" fill="none">
    <circle cx="250" cy="210" r="175"/>
    <circle cx="250" cy="210" r="145" stroke-dasharray="10,6"/>
    <circle cx="250" cy="210" r="120"/>
  </g>

  <!-- Phosphor Shadow Motes -->
  <g fill="#6ee7b7" opacity="0.8" filter="url(#rogue-smoke)">
    <circle cx="150" cy="130" r="3.5"/>
    <circle cx="350" cy="140" r="4"/>
    <circle cx="120" cy="270" r="2.5"/>
    <circle cx="380" cy="250" r="3"/>
  </g>

  <!-- Midnight Scout Vest & Harness -->
  <path d="M 100 340 C 90 410 70 480 50 500 L 450 500 C 430 480 410 410 400 340 C 340 370 160 370 100 340 Z" fill="url(#rogue2-leather)" stroke="#065f46" stroke-width="3"/>
  
  <circle cx="250" cy="350" r="12" fill="#047857" stroke="#34d399" stroke-width="2"/>
  <circle cx="250" cy="350" r="5" fill="#a7f3d0" filter="url(#rogue-smoke)"/>

  <!-- Neck -->
  <path d="M 230 235 L 230 275 C 242 283 258 283 270 275 L 270 235 Z" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>

  <!-- Anime Face -->
  <path d="M 198 175 C 198 238 224 268 250 268 C 276 268 302 238 302 175 C 302 125 198 125 198 175 Z" fill="url(#rogue2-skin)" stroke="#d97706" stroke-width="1.8"/>
  <ellipse cx="220" cy="214" rx="9" ry="4" fill="#34d399" opacity="0.35"/>
  <ellipse cx="280" cy="214" rx="9" ry="4" fill="#34d399" opacity="0.35"/>

  <!-- Eyes (Cyan-Teal Starlight) -->
  <g id="rogue2-left-eye">
    <path d="M 212 195 C 220 188 232 188 240 193" stroke="#083344" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 215 191 L 221 186" stroke="#083344" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="226" cy="201" rx="9" ry="11" fill="url(#rogue2-eye)"/>
    <ellipse cx="226" cy="201" rx="4" ry="6" fill="#082f49"/>
    <circle cx="223" cy="197" r="3" fill="#ffffff"/>
    <circle cx="229" cy="205" r="1.5" fill="#ffffff"/>
    <path d="M 218 212 C 225 215 233 214 237 211" stroke="#0891b2" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M 210 181 C 219 176 232 177 240 181" stroke="#0e7490" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
  <g id="rogue2-right-eye">
    <path d="M 288 195 C 280 188 268 188 260 193" stroke="#083344" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 285 191 L 279 186" stroke="#083344" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="274" cy="201" rx="9" ry="11" fill="url(#rogue2-eye)"/>
    <ellipse cx="274" cy="201" rx="4" ry="6" fill="#082f49"/>
    <circle cx="271" cy="197" r="3" fill="#ffffff"/>
    <circle cx="277" cy="205" r="1.5" fill="#ffffff"/>
    <path d="M 282 212 C 275 215 267 214 263 211" stroke="#0891b2" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M 290 181 C 281 176 268 177 260 181" stroke="#0e7490" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Nose & Daring Smile -->
  <path d="M 250 214 L 248 223 L 253 223" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M 242 241 C 248 244 254 244 259 241" stroke="#047857" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- Silver-White Cropped Anime Hair -->
  <g id="rogue2-hair-group">
    <path d="M 165 170 C 145 220 140 280 155 330 C 170 270 175 220 185 180 Z" fill="url(#rogue2-hair)"/>
    <path d="M 335 170 C 355 220 360 280 345 330 C 330 270 325 220 315 180 Z" fill="url(#rogue2-hair)"/>
    <path d="M 180 150 C 170 95 220 70 250 70 C 280 70 330 95 320 150 C 310 115 280 100 250 100 C 220 100 190 115 180 150 Z" fill="url(#rogue2-hair)"/>
    
    <path d="M 195 130 C 185 165 195 210 215 225 C 218 190 220 155 210 135 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <path d="M 215 125 C 225 155 235 185 240 195 C 242 170 240 145 235 125 Z" fill="url(#rogue2-hair)" stroke="#94a3b8" stroke-width="1.2"/>
    <path d="M 245 120 C 250 145 252 170 250 185 C 255 165 260 145 258 120 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <path d="M 285 125 C 275 155 265 185 260 195 C 258 170 260 145 265 125 Z" fill="url(#rogue2-hair)" stroke="#94a3b8" stroke-width="1.2"/>
    <path d="M 305 130 C 315 165 305 210 285 225 C 282 190 280 155 290 135 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  </g>

  <!-- Kunai Throwing Blade Foreground Element -->
  <g id="rogue2-kunai" filter="url(#rogue-smoke)">
    <polygon points="120,380 140,320 160,380 145,410 135,410" fill="#e2e8f0" stroke="#047857" stroke-width="2"/>
    <circle cx="140" cy="430" r="7" fill="none" stroke="#e2e8f0" stroke-width="2.5"/>
    <line x1="140" y1="410" x2="140" y2="423" stroke="#e2e8f0" stroke-width="2.5"/>
  </g>
</svg>

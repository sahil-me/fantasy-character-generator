<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="warrior1-bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#991b1b" stop-opacity="0.5"/>
      <stop offset="75%" stop-color="#240c0f" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#120406"/>
    </radialGradient>
    <linearGradient id="warrior1-hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="30%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="warrior1-steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="40%" stop-color="#94a3b8"/>
      <stop offset="80%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="warrior1-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="70%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>
    <radialGradient id="warrior1-eye" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
    <filter id="battle-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#warrior1-bg)"/>

  <!-- War Crest Runes -->
  <g opacity="0.4" stroke="#fca5a5" stroke-width="1.8" fill="none">
    <circle cx="250" cy="210" r="175"/>
    <circle cx="250" cy="210" r="145" stroke-dasharray="10,6"/>
    <polygon points="250,55 385,285 115,285"/>
  </g>

  <!-- Battle Sparks -->
  <g fill="#fef08a" opacity="0.8" filter="url(#battle-glow)">
    <circle cx="150" cy="130" r="3.5"/>
    <circle cx="350" cy="120" r="4"/>
    <circle cx="110" cy="260" r="2.5"/>
    <circle cx="390" cy="240" r="3"/>
  </g>

  <!-- Heavy Steel Armor Pauldrons -->
  <path d="M 80 350 C 80 300 130 270 180 280 C 160 340 140 400 130 450 C 100 410 80 380 80 350 Z" fill="url(#warrior1-steel)" stroke="#0f172a" stroke-width="3"/>
  <path d="M 420 350 C 420 300 370 270 320 280 C 340 340 360 400 370 450 C 400 410 420 380 420 350 Z" fill="url(#warrior1-steel)" stroke="#0f172a" stroke-width="3"/>

  <!-- Spiked Mantle & Breastplate -->
  <path d="M 175 290 C 215 280 285 280 325 290 C 340 360 330 450 320 500 L 180 500 C 170 450 160 360 175 290 Z" fill="url(#warrior1-steel)" stroke="#0f172a" stroke-width="3"/>
  
  <!-- Crimson Sash Across Chest -->
  <path d="M 160 310 L 340 490 L 300 500 L 130 330 Z" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1.5"/>

  <!-- Neck -->
  <path d="M 225 235 L 225 275 C 238 283 262 283 275 275 L 275 235 Z" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>

  <!-- Anime Face -->
  <path d="M 196 175 C 196 238 222 268 250 268 C 278 268 304 238 304 175 C 304 125 196 125 196 175 Z" fill="url(#warrior1-skin)" stroke="#e11d48" stroke-width="1.8"/>
  <ellipse cx="218" cy="214" rx="9" ry="4" fill="#fb7185" opacity="0.4"/>
  <ellipse cx="282" cy="214" rx="9" ry="4" fill="#fb7185" opacity="0.4"/>

  <!-- Eyes (Amber Flame Determination) -->
  <g id="warrior1-left-eye">
    <path d="M 210 196 C 218 189 230 189 238 194" stroke="#450a0a" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 213 192 L 219 187" stroke="#450a0a" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="225" cy="202" rx="9" ry="11" fill="url(#warrior1-eye)"/>
    <ellipse cx="225" cy="202" rx="4" ry="6" fill="#1c1917"/>
    <circle cx="222" cy="198" r="3" fill="#ffffff"/>
    <circle cx="228" cy="206" r="1.5" fill="#ffffff"/>
    <path d="M 216 213 C 223 216 231 215 235 212" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M 208 181 C 217 175 230 176 238 181" stroke="#991b1b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>
  <g id="warrior1-right-eye">
    <path d="M 290 196 C 282 189 270 189 262 194" stroke="#450a0a" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 287 192 L 281 187" stroke="#450a0a" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="275" cy="202" rx="9" ry="11" fill="url(#warrior1-eye)"/>
    <ellipse cx="275" cy="202" rx="4" ry="6" fill="#1c1917"/>
    <circle cx="272" cy="198" r="3" fill="#ffffff"/>
    <circle cx="278" cy="206" r="1.5" fill="#ffffff"/>
    <path d="M 284 213 C 277 216 269 215 265 212" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M 292 181 C 283 175 270 176 262 181" stroke="#991b1b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Nose & Fierce Warrior Grin -->
  <path d="M 250 214 L 248 223 L 253 223" stroke="#e11d48" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M 242 240 C 248 244 254 244 259 240" stroke="#be123c" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- Spiky Crimson Anime Hair -->
  <g id="warrior1-hair-group">
    <path d="M 160 170 C 130 210 135 290 150 340 C 165 280 175 230 185 180 Z" fill="url(#warrior1-hair)"/>
    <path d="M 340 170 C 370 210 365 290 350 340 C 335 280 325 230 315 180 Z" fill="url(#warrior1-hair)"/>
    <path d="M 180 150 C 170 95 220 70 250 70 C 280 70 330 95 320 150 C 310 115 280 100 250 100 C 220 100 190 115 180 150 Z" fill="url(#warrior1-hair)"/>

    <path d="M 195 130 C 185 165 195 210 215 225 C 218 190 220 155 210 135 Z" fill="#fca5a5" stroke="#7f1d1d" stroke-width="1.2"/>
    <path d="M 215 125 C 225 155 235 185 240 195 C 242 170 240 145 235 125 Z" fill="url(#warrior1-hair)" stroke="#7f1d1d" stroke-width="1.2"/>
    <path d="M 245 120 C 250 145 252 170 250 185 C 255 165 260 145 258 120 Z" fill="#fca5a5" stroke="#7f1d1d" stroke-width="1.2"/>
    <path d="M 285 125 C 275 155 265 185 260 195 C 258 170 260 145 265 125 Z" fill="url(#warrior1-hair)" stroke="#7f1d1d" stroke-width="1.2"/>
    <path d="M 305 130 C 315 165 305 210 285 225 C 282 190 280 155 290 135 Z" fill="#fca5a5" stroke="#7f1d1d" stroke-width="1.2"/>
    
    <!-- Top Spikes -->
    <path d="M 250 75 L 265 30 L 275 75 Z" fill="#fca5a5" stroke="#7f1d1d" stroke-width="1.5"/>
    <path d="M 230 85 L 220 40 L 245 80 Z" fill="#ef4444" stroke="#7f1d1d" stroke-width="1.5"/>
  </g>

  <!-- Dragonbone Greatsword Blade -->
  <g id="warrior1-blade" filter="url(#battle-glow)">
    <line x1="320" y1="480" x2="410" y2="280" stroke="url(#warrior1-steel)" stroke-width="9" stroke-linecap="round"/>
    <line x1="320" y1="480" x2="410" y2="280" stroke="#fca5a5" stroke-width="14" opacity="0.4" stroke-linecap="round"/>
  </g>
</svg>
